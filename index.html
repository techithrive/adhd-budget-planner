function reserved(){const pp=p(),day=TODAY(),pay=nextPayday(),until=pay?pay.date:addDays(day,30);const bills=openBillsTill(until),overdue=bills.filter(x=>x.date<day),upcoming=bills.filter(x=>x.date>=day);const checking=pp.accounts.filter(x=>x.kind!=='savings').reduce((a,x)=>a+cents(x.balance),0);const card=pp.debts.filter(x=>x.kind==='card').reduce((a,x)=>a+cents(x.balance),0);const recurring=pp.bills.filter(x=>x.setAside&&x.cycle==='months').reduce((a,x)=>a+Math.round(cents(x.amount)/Math.max(2,Number(x.interval)||2)),0);const goals=pp.goals.reduce((a,x)=>a+cents(x.saved),0);const envelopes=pp.envelopes.reduce((a,x)=>a+cents(x.amount),0);const due=bills.reduce((a,x)=>a+cents(x.amount),0);return {checking,card,overdue:overdue.reduce((a,x)=>a+cents(x.amount),0),upcoming:upcoming.reduce((a,x)=>a+cents(x.amount),0),recurring,goals,envelopes,due,available:checking-card-due-recurring-goals-envelopes,payday:pay,bills}}

const prog=(a,b)=>`<div class="progress"><i style="width:${percent(a,b)}%"></i></div>`;
const btn=(label,act,kind='')=>`<button class="${kind}" data-action="${act}">${label}</button>`;
const noData=msg=>`<div class="empty">${msg}</div>`;
function nextThing(){const r=reserved();if(r.bills.some(x=>x.date<TODAY()))return `You have an overdue bill to review: ${esc(r.bills.find(x=>x.date<TODAY()).name)}.`;if(!p().income.length)return 'Add your first paycheck to see your payday runway.';if(!p().accounts.length)return 'Add a checking account to make your safe-to-spend number meaningful.';if(r.bills.length)return `Check your next bill: ${esc(r.bills[0].name)} on ${fmtDate(r.bills[0].date)}.`;return 'Log one recent spend. That is enough for now.'}

let backupDismissed=false;
function readinessBanners(){let blocks=[];if(!storageWorks)blocks.push(`<div class="info-bar" role="status"><div><strong>Saving is blocked in this viewer</strong> — open this file in Chrome or Safari so your entries are saved.</div>${btn('Learn how','storageHelp')}</div>`);if(p().exampleMode===true && p().onboard>=5)blocks.push(`<div class="info-bar"><div><strong>Example numbers — not your real money.</strong> Tap Start fresh to enter yours.</div>${btn('Start fresh','fresh','primary')}</div>`);if(p().onboard>=5&&!backupDismissed){let last=null;try{last=storageWorks?localStorage.getItem(BACKUP_META):null}catch(e){}let lastPrompt=null;try{lastPrompt=storageWorks?localStorage.getItem(BACKUP_NUDGE):null}catch(e){}if(!lastPrompt&&storageWorks){try{localStorage.setItem(BACKUP_NUDGE,TODAY());lastPrompt=TODAY()}catch(e){}}if((!last||((date(TODAY())-date(last))/MS>=7)) && (!lastPrompt || (date(TODAY())-date(lastPrompt))/MS>=7))blocks.push(`<div class="info-bar"><div><strong>Friendly reminder:</strong> Keep a backup of your planners somewhere safe.</div><div class="row">${btn('Back up now','export','primary')}${btn('Not now','dismissBackup')}</div></div>`)}return blocks.length?`<div class="stack section">${blocks.join('')}</div>`:''}
const faqItems=[
['What is Safe to Spend?','It is your spendable checking money after subtracting cards, unpaid bills due through your next payday, goals, envelopes and monthly set-asides. Bills after your next payday are not reserved yet.'],
['Why is my number negative?','Your recorded commitments are higher than your spendable balance. Check your account amounts, unpaid bills and reserved goals; this is a planning estimate, not a bank overdraft notice.'],
['Where is my data stored?','On this device in your browser’s local storage when the browser permits it. It does not automatically sync between devices.'],
['Does it connect to my bank?','Never. There is no bank connection, no account and no password. You enter and update your own figures.'],
['Is there a subscription?','No. This is a one-time purchase with no in-app subscription.'],
['What happens if I lose the file?','Keep a copy of the original HTML download and your exported JSON backups. The HTML file alone cannot restore entries that were stored on another device.'],
['How do I move to a new phone?','Export a full JSON backup on the old device, copy the HTML app and backup file to the new device, then use Import JSON backup in Settings.'],
['How do I add a second planner for a family member?','Choose + Planner at the top or Add planner in Settings. Each profile has separate financial records, and the same JSON backup includes all profiles.'],
['How do I back up my data?','Go to Settings and select Download full JSON backup. Save the file somewhere you can retrieve it; Import JSON backup restores all planners together.'],
['How do I delete/reset everything?','Use Start fresh in Settings to reset the active planner. To remove all local data, clear this app’s browser storage; export a backup first if you might need your entries.'],
['How do I get updates?','Use the updated HTML file provided by KrafzenStudio, when available, and import your most recent JSON backup. This offline file cannot download updates by itself.']
];
function helpMarkup(inWizard=false){return `<div class="eyebrow">Calm guidance</div><h2>Help & FAQ</h2><p class="caption">Short answers for common questions. Your budget data stays private on your device.</p><div class="stack">${faqItems.map(([q,a])=>`<div class="notice"><strong>${esc(q)}</strong><div class="caption" style="margin-top:6px">${esc(a)}</div></div>`).join('')}</div>${inWizard?`<div class="formactions">${btn('Back to setup','backToOnboard','primary')}</div>`:''}`}
function helpPage(){return `<div class="stack"><div class="hero"><div class="eyebrow">Help & FAQ</div><h2>Answers, without overwhelm.</h2><p class="muted">Everything you need to start, save and protect your planner.</p></div><div class="card">${helpMarkup()}</div><div class="card"><h2>Backup and restore</h2><p class="caption">One complete JSON backup includes every planner, transaction, bill and setting.</p><div class="actions">${btn('Export JSON backup','export','primary')}${btn('Import JSON backup','import')}</div></div></div>`}

function header(){const names=['Today','Month','Must-pays','Money in','Goals','Debt','Envelopes','Milestones','Notes','Reports','Settings','Help'];const nav=names.filter(x=>p().view!=='simple'||['Today','Month','Must-pays','Money in','Settings'].includes(x));return `<div class="sidebar"><div class="brand"><div class="logo">✦</div><div>Calm Budget<small>KRAFZEN STUDIO</small></div></div><nav class="nav">${nav.map((x,i)=>`<button data-page="${x}" class="${x===page?'active':''}"><span>${({'Today':'◈','Month':'▦','Must-pays':'◷','Money in':'↗','Goals':'◎','Debt':'⇩','Envelopes':'▣','Milestones':'✧','Notes':'≡','Reports':'▤','Settings':'⚙','Help':'?'})[x]}</span>${x}</button>`).join('')}</nav><div class="sidebottom">Private by design · Stored on this device<br>Not a medical or financial product.</div></div><main><div class="top"><div class="row"><button class="menu-toggle" data-action="menu">☰</button><div><div class="eyebrow">A little clarity, every day</div><h1>${esc(page)}</h1></div></div><div class="topactions"><select id="profileSwitch" class="profile" aria-label="Select planner">${db.profiles.map(x=>`<option value="${esc(x.id)}" ${db.active===x.id?'selected':''}>${esc(x.name)}</option>`).join('')}</select><button data-action="newProfile">+ Planner</button><button data-action="search">⌕ Search</button><button data-action="focus">${focus?'Exit focus':'◉ Focus'}</button></div></div><div id="content">`}
function footer(){return `</div><div class="secondary caption" style="text-align:center;padding:24px">Calm Budget Planner · Krafzen Studio · Local-only · Not a medical or financial product.</div></main><div class="mobilebar"><button data-page="Today"><span>◈</span>Today</button><button data-page="Month"><span>▦</span>Month</button><button data-page="Must-pays"><span>◷</span>Bills</button><button data-page="Money in"><span>↗</span>Income</button><button data-page="Settings"><span>⚙</span>More</button></div>`}
function render(){const r=reserved();document.body.dataset.theme=p().theme||'midnight';document.body.style.setProperty('--accent',p().accent||'');if(!p().accent)document.body.style.removeProperty('--accent');document.body.classList.toggle('focus',focus);document.getElementById('app').innerHTML=`<div class="app">${header()}${readinessBanners()}${({'Today':today,'Month':monthPage,'Must-pays':billsPage,'Money in':incomePage,'Goals':goalsPage,'Debt':debtPage,'Envelopes':envelopePage,'Milestones':milestonePage,'Notes':notesPage,'Reports':reportsPage,'Settings':settingsPage,'Help':helpPage})[page]?.(r)||today(r)}${footer()}</div>`;if(p().onboard<5)showOnboarding();else document.body.classList.remove('onboarding-active');}
function today(r){const cfg=p().cardPrefs||{},billWeek=billEvents(TODAY(),addDays(TODAY(),7)).filter(x=>!x.paid);return `<div class="stack"><div class="hero"><span class="pill">✦ Your calm money snapshot</span><div style="margin-top:23px;color:var(--muted);font-weight:750">SAFE TO SPEND TODAY</div><div class="amount ${r.available<0?'negative':''}">${money(r.available/100)}</div><p class="muted" style="max-width:480px">Your checking money, minus the commitments you have already made. A guide, not a guarantee of cleared funds.</p><div class="actions"><button class="primary" data-action="breakdown">How is this worked out? ↗</button><button data-action="quickSpend">+ Log a spend</button></div></div>${cfg.next!==false?`<div class="notice"><div class="eyebrow">Just one next step</div><strong>${nextThing()}</strong></div>`:''}${cfg.runway!==false?`<div class="grid"><div class="card"><h2>Until your next payday</h2><div class="kpi">${r.payday?fmtDate(r.payday.date):'No payday set'}</div><div class="caption">${r.payday?`${esc(r.payday.name)} · ${money(r.payday.amount)}`:'Add income in Money in to see your runway.'}</div><div class="divider"></div><strong>Day-by-day forecast</strong><div class="caption">Illustrative balance after scheduled unpaid bills; future income not assumed until received.</div>${forecast(r)}</div><div class="card"><h2>Money at a glance</h2><div class="kpi-row"><div><span class="muted">Checking</span><div class="kpi">${money(r.checking/100)}</div></div><div><span class="muted">Bills reserved</span><div class="kpi">${money(r.due/100)}</div></div></div><div class="divider"></div><div class="barrow"><span class="muted">Credit card balances</span><strong>${money(r.card/100)}</strong></div><div class="barrow"><span class="muted">Goals + envelopes</span><strong>${money((r.goals+r.envelopes)/100)}</strong></div><div class="barrow"><span class="muted">Set-aside per month</span><strong>${money(r.recurring/100)}</strong></div></div></div>`:''}${cfg.quick!==false?`<div class="grid"><div class="card"><h2>Quick spend · no fuss</h2><div class="quick">${[5,10,20,50,100].map(v=>`<button data-amount="${v}" class="${quickAmount===v?'primary':''}">${money(v)}</button>`).join('')}</div><div class="fields" style="margin-top:14px"><div class="field"><label>Amount</label><input id="quickValue" type="number" min="0.01" step="0.01" value="${quickAmount}"></div><div class="field"><label>Category</label><select id="quickCategory">${categories.map(x=>`<option>${x}</option>`).join('')}</select></div><div class="field wide"><label>Optional note</label><input id="quickNote" placeholder="What was it for?"></div></div><div class="formactions"><button class="primary" data-action="saveQuick">Save spend ↗</button></div></div><div class="card"><h2>Quick actions</h2><p class="caption">Try “20 groceries”, “45 transport”, “bills”, “goals” or “report”.</p><input id="command" placeholder="20 groceries"><div class="formactions"><button class="primary" data-action="command">Go ↗</button></div><div class="divider"></div><p class="caption">A small action is still progress. No streaks, no judgement.</p></div></div>`:''}${cfg.bills!==false?`<div class="card"><div class="row space"><h2>Bills coming in the next 7 days</h2>${btn('All must-pays','gotoBills')}</div>${billWeek.length?billWeek.slice(0,5).map(b=>`<div class="item"><div><strong>${esc(b.name)}</strong><div class="small muted">${fmtDate(b.date)}</div></div><div class="row"><strong>${money(b.amount)}</strong>${btn('Mark paid','payBill:'+b.key,'tiny')}</div></div>`).join(''):noData('All clear for the next seven days.')}</div>`:''}${cfg.goals!==false?`<div class="card"><div class="row space"><h2>Goals in motion</h2>${btn('View goals','gotoGoals')}</div>${p().goals.slice(0,3).map(g=>`<div class="item" style="display:block"><div class="barrow"><strong>${esc(g.name)}</strong><span class="muted">${money(g.saved)} / ${money(g.target)}</span></div>${prog(g.saved,g.target)}</div>`).join('')||noData('Add a small goal when you feel ready.')}</div>`:''}${cfg.analytics!==false?`<div class="card"><div class="row space"><h2>This month, in perspective</h2>${btn('Full reports','gotoReports')}</div>${categoryBars(month(TODAY()))}</div>`:''}${cfg.brain!==false?`<div class="card"><h2>Brain dump · thoughts only</h2><p class="caption">This stays separate from all money calculations.</p><textarea id="brain" placeholder="Put your thoughts here. No amount or category needed.">${esc(p().brain||'')}</textarea><div class="formactions"><button data-action="saveBrain" class="primary">Save thoughts</button></div></div>`:''}</div>`}
function forecast(r){let v=r.checking,arr=[];for(let i=0;i<Math.min(14,Math.max(7,r.payday?Math.round((date(r.payday.date)-date(TODAY()))/MS)+1:7));i++){const d=addDays(TODAY(),i),due=r.bills.filter(b=>b.date===d).reduce((s,b)=>s+cents(b.amount),0);v-=due;arr.push(`<div class="barrow small"><span>${i?'': 'Today · '}${fmtDate(d)}</span><span class="money ${v<0?'negative':''}">${money(v/100)}</span></div>`)}return arr.join('')}
function breakdown(){let r=reserved();return `<h2>How safe to spend is worked out</h2><p class="caption">Amounts are rounded to cents. This is a conservative planning estimate. Savings accounts are excluded entirely.</p>${[['Spendable checking + cash accounts',r.checking],['Credit card balances',-r.card],['Overdue unpaid bills',-r.overdue],['Unpaid bills through next payday',-r.upcoming],['Monthly infrequent-bill set-aside',-r.recurring],['Savings goal reserves',-r.goals],['Envelope reserves',-r.envelopes]].map(([label,x])=>`<div class="barrow"><span>${label}</span><strong>${money(x/100)}</strong></div>`).join('')}<div class="divider"></div><div class="barrow"><strong>Safe to spend today</strong><strong class="positive">${money(r.available/100)}</strong></div><p class="caption">The card balance is reserved separately; card repayments are treated as transfers rather than a second expense. To avoid double-counting, enter bank balances as current cleared balances and keep goals/envelopes as amounts reserved within those balances. Future scheduled paychecks are not added automatically.</p>`}
function monthPage(){let [y,m]=selectedMonth.split('-').map(Number),start=`${selectedMonth}-01`,last=iso(new Date(y,m,0)),sp=p().spends.filter(x=>month(x.date)===selectedMonth),bill=billEvents(start,last),inc=incomeEvents(start,last),out=sp.reduce((s,x)=>s+x.amount,0)+bill.filter(x=>x.paid).reduce((s,x)=>s+x.amount,0),income=inc.filter(x=>x.received).reduce((s,x)=>s+x.amount,0),first=new Date(y,m-1,1).getDay(),cells=[];for(let k=0;k<first;k++)cells.push('<div></div>');for(let d=1;d<=endDay(y,m);d++){let s=selectedMonth+'-'+String(d).padStart(2,'0'),b=bill.filter(x=>x.date===s),i=inc.filter(x=>x.date===s),z=sp.filter(x=>x.date===s);cells.push(`<div class="datecell ${s===TODAY()?'today':''}"><strong>${d}</strong><div>${b.map(()=>'<i class="dot bill"></i>').join('')}${i.map(()=>'<i class="dot income"></i>').join('')}${z.map(()=>'<i class="dot"></i>').join('')}</div><div class="small muted" style="overflow:hidden;white-space:nowrap;text-overflow:ellipsis">${esc(b[0]?.name||z[0]?.category||'')}</div></div>`) }return `<div class="stack"><div class="card"><div class="row space"><h2>${new Date(y,m-1,1).toLocaleDateString('en-US',{month:'long',year:'numeric'})}</h2><div class="row">${btn('←','prevMonth','tiny')}${btn('Today','thisMonth','tiny')}${btn('→','nextMonth','tiny')}</div></div><div class="calendar">${['Sun','Mon','Tue','Wed','Thu','Fri','Sat'].map(x=>`<div class="callday">${x}</div>`).join('')}${cells.join('')}</div><div class="chartlegend"><span><i class="dot income"></i> Paycheck</span><span><i class="dot bill"></i> Bill</span><span><i class="dot"></i> Spend</span></div></div><div class="grid three"><div class="card"><div class="muted">Recorded money in</div><div class="kpi">${money(income)}</div></div><div class="card"><div class="muted">Recorded money out</div><div class="kpi">${money(out)}</div></div><div class="card"><div class="muted">Kept (in − out)</div><div class="kpi">${money(income-out)}</div></div></div><div class="grid"><div class="card"><h2>Happening this month</h2>${[...sp.map(x=>({date:x.date,name:x.note||x.category,amount:-x.amount})),...bill.map(x=>({date:x.date,name:x.name+(x.paid?' · paid':' · upcoming'),amount:-x.amount})),...inc.map(x=>({date:x.date,name:x.name+(x.received?' · received':' · expected'),amount:x.amount}))].sort((a,b)=>a.date.localeCompare(b.date)).slice(0,45).map(x=>`<div class="item"><div><strong>${esc(x.name)}</strong><div class="small muted">${fmtDate(x.date)}</div></div><strong>${money(x.amount)}</strong></div>`).join('')||noData('Nothing scheduled.')}</div><div class="card"><h2>Notes for ${new Date(y,m-1,1).toLocaleDateString('en-US',{month:'long'})}</h2><textarea id="monthNote" rows="12" placeholder="A gentle reminder to yourself...">${esc(p().notes[selectedMonth]||'')}</textarea><div class="formactions">${btn('Save month note','saveMonthNote','primary')}</div></div></div></div>`}
function billsPage(){let bills=billEvents(addDays(TODAY(),-365),addDays(TODAY(),90)),owed=bills.filter(x=>!x.paid&&x.date<=addDays(TODAY(),30)),recent=paymentHistory();return `<div class="stack"><div class="grid three"><div class="card"><div class="muted">Still to go out · next 30 days + overdue</div><div class="kpi">${money(owed.reduce((s,b)=>s+b.amount,0))}</div></div><div class="card"><div class="muted">Overdue · needs review</div><div class="kpi warning">${owed.filter(x=>x.date<TODAY()).length}</div></div><div class="card"><div class="muted">Next 7 days</div><div class="kpi">${owed.filter(x=>x.date<=addDays(TODAY(),7)).length}</div></div></div><div class="card"><div class="row space"><h2>Must-pays · overdue first</h2>${btn('+ Add bill','add:bill','primary')}</div>${owed.sort((a,b)=>a.date.localeCompare(b.date)).map(b=>`<div class="item"><div class="row"><div class="iconbox">◷</div><div><strong>${esc(b.name)}</strong><div class="small ${b.date<TODAY()?'negative':'muted'}">${fmtDate(b.date)} ${b.date<TODAY()?'· overdue':''}</div></div></div><div class="row"><strong>${money(b.amount)}</strong>${btn('Paid','payBill:'+b.key,'tiny primary')}</div></div>`).join('')||noData('Nothing unpaid in this window.')}</div><div class="grid"><div class="card"><h2>Recurring bill setup</h2>${p().bills.map(b=>`<div class="item"><div><strong>${esc(b.name)}</strong><div class="small muted">${money(b.amount)} · ${esc(b.cycle)} ${b.cycle==='months'?`every ${b.interval} months`:''}${b.setAside?' · set-aside on':''}</div></div><div class="row">${btn('Edit','edit:bill:'+b.id,'tiny')}${btn('Delete','delete:bill:'+b.id,'tiny danger')}</div></div>`).join('')||noData('Add your first bill.')}</div><div class="card"><h2>Recently paid · undo if needed</h2>${recent.slice(0,10).map(b=>`<div class="item"><div><strong>${esc(b.name)}</strong><div class="small muted">${fmtDate(b.date)}</div></div><div class="row"><strong>${money(b.amount)}</strong>${btn('Undo','undoBill:'+b.key,'tiny')}</div></div>`).join('')||noData('No payments marked yet.')}<div class="divider"></div><h3>Reminder list · coming week</h3>${billEvents(TODAY(),addDays(TODAY(),7)).filter(x=>!x.paid).map(b=>`<div class="barrow"><span>${fmtDate(b.date)} · ${esc(b.name)}</span><strong>${money(b.amount)}</strong></div>`).join('')||'<p class="muted">Nothing due this week.</p>'}</div></div></div>`}
function incomePage(){const incoming=incomeEvents(addDays(TODAY(),-30),addDays(TODAY(),70)),pending=incoming.filter(x=>!x.received&&x.date>=TODAY());return `<div class="stack"><div class="grid three"><div class="card"><div class="muted">Next expected income</div><div class="kpi">${money(pending[0]?.amount||0)}</div><div class="caption">${pending[0]?fmtDate(pending[0].date):'Add a schedule'}</div></div><div class="card"><div class="muted">Still to come · next 30 days</div><div class="kpi">${money(pending.filter(x=>x.date<=addDays(TODAY(),30)).reduce((s,x)=>s+x.amount,0))}</div></div><div class="card"><div class="muted">Spendable bank balances</div><div class="kpi">${money(reserved().checking/100)}</div><div class="caption">Savings accounts excluded</div></div></div><div class="grid"><div class="card"><div class="row space"><h2>Income schedules</h2>${btn('+ Income','add:income','primary')}</div>${p().income.map(i=>`<div class="item"><div><strong>${esc(i.name)}</strong><div class="small muted">${esc(i.schedule)} · ${money(i.amount)} · ${Number(i.splits)||0}% auto-split to savings on receipt</div></div><div class="row">${btn('Edit','edit:income:'+i.id,'tiny')}${btn('Delete','delete:income:'+i.id,'tiny danger')}</div></div>`).join('')||noData('No income sources yet.')}<p class="caption">Weekend paydays automatically move to the previous Friday. Future income is not credited until you mark it received.</p></div><div class="card"><div class="row space"><h2>Bank accounts</h2>${btn('+ Account','add:account','primary')}</div>${p().accounts.map(a=>`<div class="item"><div><strong>${esc(a.name)}</strong><div class="small muted">${a.kind==='savings'?'🔒 Savings · excluded from spendable':'Checking / cash · spendable'}</div></div><div class="row"><strong>${money(a.balance)}</strong>${btn('Edit','edit:account:'+a.id,'tiny')}${btn('Delete','delete:account:'+a.id,'tiny danger')}</div></div>`).join('')}<p class="caption">Account balances are entered manually. Recording a spend or marki function download(name,content,type){pendingExport={name,content,type};if(name.endsWith('.json')&&storageWorks){try{localStorage.setItem(BACKUP_META,TODAY());localStorage.setItem(BACKUP_NUDGE,TODAY())}catch(e){}}backupDismissed=true;try{const blob=new Blob([content],{type}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download=name;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),15000);toast('Export prepared: '+name);modal(`<h2>Export ready</h2><p>Download requested: <strong>${esc(name)}</strong>. If your browser blocked it, use the Copy fallback below.</p><div class="formactions">${btn('Close','close')}${btn('Show & copy data','exportFallback','primary')}</div>`)}catch(e){exportFallback()}}
function exportFallback(){if(!pendingExport)return;modal(`<h2>Copy your ${pendingExport.name.endsWith('.csv')?'CSV':'JSON'} backup</h2><p class="muted">Select and copy this text if downloading was blocked.</p><textarea id="exportText" rows="13" readonly>${esc(pendingExport.content)}</textarea><div class="formactions">${btn('Close','close')}${btn('Copy data','copyExport','primary')}</div>`)}

function csv(){const quote=v=>'"'+String(v??'').replaceAll('"','""')+'"';let rows=[['Profile','Record type','Date','Name','Category','Amount','Detail']];for(let pp of db.profiles){for(let s of pp.spends)rows.push([pp.name,'spend',s.date,s.note,s.category,s.amount,'']);for(let b of pp.bills)rows.push([pp.name,'bill rule',b.anchor,b.name,b.cycle,b.amount,b.interval||'']);for(let i of pp.income)rows.push([pp.name,'income rule',i.anchor,i.name,i.schedule,i.amount,i.splits||0]);for(let x of pp.billPayments)rows.push([pp.name,'bill paid',x.date,x.key,'',x.amount,'']);for(let x of pp.paychecks)rows.push([pp.name,'paycheck received',x.date,x.key,'',x.amount,'']);for(let x of pp.debtPayments)rows.push([pp.name,'debt payment',x.date,x.name,x.kind,x.amount,'']);for(let x of pp.goals)rows.push([pp.name,'goal','',''+x.name,'',x.saved,'target '+x.target]);for(let x of pp.accounts)rows.push([pp.name,'account','',''+x.name,x.kind,x.balance,''])}download('Calm-Budget-Records.csv',rows.map(r=>r.map(quote).join(',')).join('\r\n'),'text/csv;charset=utf-8')}
function searchModal(){modal(`<h2>Search your planner</h2><input id="searchBox" placeholder="Search spends, bills, goals..." autofocus><div id="searchResults" style="margin-top:15px"></div><div class="formactions">${btn('Close','close')}</div>`);document.getElementById('searchBox').focus();searchResults('')}
function searchResults(s){let data=[...p().spends.map(x=>({label:x.note||x.category,detail:`Spend · ${fmtDate(x.date)} · ${money(x.amount)}`,page:'Reports'})),...p().bills.map(x=>({label:x.name,detail:`Bill · ${money(x.amount)}`,page:'Must-pays'})),...p().goals.map(x=>({label:x.name,detail:`Goal · ${money(x.saved)} saved`,page:'Goals'})),...p().income.map(x=>({label:x.name,detail:`Income · ${money(x.amount)}`,page:'Money in'}))].filter(x=>(x.label+' '+x.detail).toLowerCase().includes(s.toLowerCase()));document.getElementById('searchResults').innerHTML=data.slice(0,40).map(x=>`<div class="item"><div><strong>${esc(x.label)}</strong><div class="small muted">${esc(x.detail)}</div></div><button class="tiny" data-page="${x.page}">Open</button></div>`).join('')||noData('No matching records.')}
function showOnboarding(){document.body.classList.add('onboarding-active');const n=Math.max(0,Math.min(4,Number(p().onboard)||0)),steps=['Welcome','Your name & currency','Checking balance','Your next payday','Your first bill'];const v=p().wizard||{};let fields='';if(n===0)fields='<div class="notice">Example numbers — not your real money. Explore the demo, or complete these steps to use your own figures. Your financial details stay on this device.</div><div class="formactions"><button data-action="onboardHelp">Help & FAQ</button></div>';
if(n===1)fields=`<div class="fields"><div class="field"><label>Your planner name</label><input id="wizName" value="${esc(v.name||(p().name==='My calm planner'?'':p().name))}" placeholder="My calm planner"></div><div class="field"><label>Currency</label><select id="wizCurrency">${currencies.map(c=>`<option value="${c}" ${c===(v.currency||p().currency)?'selected':''}>${c}</option>`).join('')}</select></div></div>`;
if(n===2)fields=`<div class="field"><label>Current spendable checking balance</label><input id="wizBalance" type="number" step="0.01" min="0" value="${esc(v.balance??'')}" placeholder="0.00"></div><p class="caption">Savings accounts are not included in Safe to Spend.</p>`;
if(n===3)fields=`<div class="fields"><div class="field"><label>Paycheck name</label><input id="wizPayName" value="${esc(v.payName||'Paycheck')}"></div><div class="field"><label>Paycheck amount</label><input id="wizPayAmount" type="number" min="0" step="0.01" value="${esc(v.payAmount??'')}"></div><div class="field"><label>Schedule</label><select id="wizSchedule">${['weekly','biweekly','monthly','twice','months','once'].map(x=>`<option ${x===(v.schedule||'biweekly')?'selected':''}>${x}</option>`).join('')}</select></div><div class="field"><label>First or next payday</label><input id="wizPayDate" type="date" value="${esc(v.payDate||addDays(TODAY(),7))}"></div></div>`;
if(n===4)fields=`<div class="fields"><div class="field"><label>Bill name</label><input id="wizBillName" value="${esc(v.billName||'Utilities')}"></div><div class="field"><label>Bill amount</label><input id="wizBillAmount" type="number" min="0" step="0.01" value="${esc(v.billAmount??'')}"></div><div class="field"><label>First due date</label><input id="wizBillDate" type="date" value="${esc(v.billDate||addDays(TODAY(),10))}"></div><div class="field"><label>Repeat</label><select id="wizBillCycle">${['monthly','twice','weekly','biweekly','months','once'].map(x=>`<option ${x===(v.billCycle||'monthly')?'selected':''}>${x}</option>`).join('')}</select></div></div>`;
modal(`<div class="eyebrow">Your calm beginning · ${n+1} / 5</div><h2>${steps[n]}</h2><p class="muted">${['Start with one manageable step at a time.','Make your budget yours.','Enter your real available money.','Choose when money comes in.','Add one bill, then open your new planner.'][n]}</p>${fields}<div class="formactions">${n?btn('← Back','onboardBack'):btn('Cancel setup','onboardCancel')}${btn(n===4?'Done · Open Today':'Next →','onboardNext','primary')}</div>`)}
function saveWizardStep(n){let v=p().wizard||(p().wizard={}),get=id=>document.getElementById(id)?.value;if(n===1){v.name=get('wizName')?.trim()||'My calm planner';v.currency=get('wizCurrency')}if(n===2){v.balance=moneyVal(get('wizBalance'));if(v.balance<0)return false}if(n===3){v.payName=get('wizPayName')?.trim()||'Paycheck';v.payAmount=moneyVal(get('wizPayAmount'));v.schedule=get('wizSchedule');v.payDate=get('wizPayDate');if(!v.payDate||v.payAmount<0)return false}if(n===4){v.billName=get('wizBillName')?.trim()||'Utilities';v.billAmount=moneyVal(get('wizBillAmount'));v.billDate=get('wizBillDate');v.billCycle=get('wizBillCycle');if(!v.billDate||v.billAmount<0)return false}return true}
function finishWizard(){let q=p(),v=q.wizard||{},saved={id:q.id,theme:q.theme,accent:q.accent,view:q.view,cardPrefs:q.cardPrefs};Object.assign(q,demo(),saved);q.name=v.name||'My calm planner';q.currency=v.currency||'USD';q.accounts=[{id:uid(),name:'Everyday checking',kind:'checking',balance:moneyVal(v.balance)}];q.income=v.payAmount>0?[{id:uid(),name:v.payName,amount:v.payAmount,schedule:v.schedule,anchor:v.payDate,day:date(v.payDate).getDate(),day2:15,interval:2,splits:0}]:[];q.bills=v.billAmount>0?[{id:uid(),name:v.billName,amount:v.billAmount,cycle:v.billCycle,anchor:v.billDate,day:date(v.billDate).getDate(),day2:15,interval:2,setAside:false}]:[];for(const k of ['billPayments','paychecks','spends','transfers','goals','debts','debtPayments','envelopes','budgets','challenges','milestones'])q[k]=[];q.notes={};q.brain='';q.onboard=5;q.exampleMode=false;delete q.wizard;page='Today';save();closeModal();render();toast('Setup complete. Your real numbers are now on Today.')}

function confirmDelete(label,run){pendingConfirm=run;modal(`<h2>Confirm deletion</h2><p>Delete ${esc(label)}? This cannot be undone. Export a backup first if needed.</p><div class="formactions">${btn('Cancel','close')}${btn('Delete','acceptDelete','danger')}</div>`)}
let pendingConfirm=null,pendingImport=null,pendingExport=null,pendingFresh=false;
function runAction(act){let [a,t,id]=act.split(':');if(a==='onboardHelp'){document.body.classList.add('onboarding-active');return modal(helpMarkup(true))}if(a==='backToOnboard')return showOnboarding();if(a==='openHelp'){page='Help';closeModal();return render()}if(a==='storageHelp')return modal('<h2>Open in a browser that can save</h2><p>1. Save the HTML file to your phone’s Files or Downloads folder.</p><p>2. Open it in Chrome on Android or Safari on iPhone, rather than inside an email, chat or preview viewer.</p><p>3. If that browser still blocks file storage, export a JSON backup after every session and import it next time.</p>'+btn('Close','close','primary'));if(a==='dismissBackup'){backupDismissed=true;if(storageWorks){try{localStorage.setItem(BACKUP_NUDGE,TODAY())}catch(e){}}return render()}if(a==='close')return closeModal();if(a==='cancelFresh'){pendingFresh=false;return closeModal()}if(a==='acceptDelete'){let f=pendingConfirm;pendingConfirm=null;closeModal();if(f)change(f);return}if(a==='menu'){document.body.classList.toggle('navopen');return}if(a==='focus'){focus=!focus;return render()}if(a==='breakdown')return modal(breakdown()+`<div class="formactions">${btn('Close','close','primary')}</div>`);if(a==='gotoBills'){page='Must-pays';return render()}if(a==='gotoGoals'){page='Goals';return render()}if(a==='gotoReports'){page='Reports';return render()}if(a==='add'||a==='edit')return showForm(t,id);if(a==='search')return searchModal();if(a==='quickSpend'){return modal(`<h2>Log a quick spend</h2><div class="fields"><div class="field"><label>Amount</label><input id="modalAmount" type="number" step="0.01" min="0.01" value="20"></div><div class="field"><label>Category</label><select id="modalCategory">${categories.map(x=>`<option>${x}</option>`).join('')}</select></div><div class="field wide"><label>Note</label><input id="modalNote"></div><div class="field"><label>Date</label><input id="modalDate" type="date" value="${TODAY()}"></div></div><div class="formactions">${btn('Cancel','close')}${btn('Save spend','submitModalSpend','primary')}</div>`)}if(a==='submitModalSpend'){let e=v=>document.getElementById(v).value;logSpend(e('modalAmount'),e('modalCategory'),e('modalNote'),e('modalDate'));return closeModal()}if(a==='saveQuick'){let e=v=>document.getElementById(v).value;return logSpend(e('quickValue'),e('quickCategory'),e('quickNote'))}if(a==='command'){let s=document.getElementById('command')?.value?.trim()||'',m=s.match(/^([0-9]+(?:\.[0-9]{1,2})?)\s+(.+)$/);if(m){let c=categories.find(x=>x.toLowerCase()===m[2].toLowerCase())||categories.find(x=>x.toLowerCase().startsWith(m[2].toLowerCase()))||'Other';return logSpend(m[1],c,m[2])}let dest={bills:'Must-pays',goals:'Goals',report:'Reports',reports:'Reports',month:'Month',income:'Money in',debt:'Debt',notes:'Notes'}[s.toLowerCase()];if(dest){page=dest;return render()}return toast('Try “20 groceries”, “bills” or “reports”.')}if(a==='saveBrain'){change(()=>p().brain=document.getElementById('brain').value);return toast('Thoughts saved.')}if(a==='saveMonthNote'||a==='saveCurrentNote'){change(()=>p().notes[a==='saveMonthNote'?selectedMonth:month(TODAY())]=document.getElementById('monthNote').value);return toast('Month note saved.')}if(['prevMonth','nextMonth','thisMonth'].includes(a)){let [y,m]=selectedMonth.split('-').map(Number);selectedMonth=a==='thisMonth'?month(TODAY()):iso(new Date(y,m-1+(a==='nextMonth'?1:-1),1)).slice(0,7);return render()}if(a==='payBill'||a==='undoBill'){const key=id===undefined?t:t+'|'+id;const changed=markedBill(key,a==='payBill');if(changed){save();render();toast(a==='payBill'?'Bill marked paid.':'Payment undone.');}else toast(a==='payBill'?'This bill occurrence is already paid or unavailable.':'Payment not found.');return;}if(a==='receiveIncome'||a==='undoIncome')return change(()=>markedIncome(t+':'+id,a==='receiveIncome'));if(a==='contribute')return contribute(t,id);if(a==='saveContrib'){let v=Number(document.getElementById('contribAmount')?.value);if(!Number.isFinite(v)||v<=0)return toast('Enter a positive amount.');change(()=>{let x=p()[collections[t]].find(x=>x.id===id);if(x){if(t==='goal')x.saved=moneyVal(x.saved+v);else x.progress=moneyVal(x.progress+v)}});closeModal();return toast('Progress saved.')}if(a==='saveDebtPay'){let d=p().debts.find(x=>x.id===t),amount=moneyVal(document.getElementById('debtPayAmount')?.value);if(!d||amount<=0||amount>d.balance)return toast('Enter a valid payment within the balance.');change(()=>{let account=updateBalance(-amount);d.balance=moneyVal(d.balance-amount);p().debtPayments.push({id:uid(),name:d.name,debtId:t,date:TODAY(),amount,kind:d.kind,account})});closeModal();return toast('Debt payment recorded.')}if(a==='payDebt')return payDebt(t);if(a==='undoDebt')return change(()=>{let x=p().debtPayments.find(x=>x.id===t);if(!x)return;let d=p().debts.find(x=>x.id===x.debtId),acc=p().accounts.find(x=>x.id===x.account);if(d)d.balance=moneyVal(d.balance+x.amount);if(acc)acc.balance=moneyVal(acc.balance+x.amount);p().debtPayments=p().debtPayments.filter(z=>z.id!==t)});if(a==='deleteSpend')return confirmDelete('spend',()=>{let x=p().spends.find(x=>x.id===t),acc=p().accounts.find(a=>a.id===x?.account);if(acc)acc.balance=moneyVal(acc.balance+x.amount);p().spends=p().spends.filter(x=>x.id!==t)});if(a==='delete')return confirmDelete(t,()=>p()[collections[t]]=p()[collections[t]].filter(x=>x.id!==id));if(a==='exportFallback')return exportFallback();if(a==='copyExport'){let box=document.getElementById('exportText');box?.select();if(navigator.clipboard?.writeText){navigator.clipboard.writeText(pendingExport.content).then(()=>toast('Copied to clipboard.')).catch(()=>toast('Select the text and copy manually.'))}else toast('Text selected. Copy using Ctrl+C or Cmd+C.');return}if(a==='export')return download('Calm-Budget-Backup-'+TODAY()+'.json',JSON.stringify(db,null,2),'application/json');if(a==='csv')return csv();if(a==='import'){let input=document.createElement('input');input.type='file';input.accept='.json,application/json';input.onchange=async()=>{try{let x=JSON.parse(await input.files[0].text());if(!Array.isArray(x.profiles)||!x.profiles.length||!x.profiles.every(y=>y.id&&Array.isArray(y.accounts)&&Array.isArray(y.spends)&&Array.isArray(y.bills)))throw Error('Invalid planner backup');pendingImport=x;modal(`<h2>Import backup?</h2><p>Replace every existing planner on this device with the selected backup?</p><div class="formactions">${btn('Cancel','close')}${btn('Replace planners','acceptImport','danger')}</div>`)}catch(e){toast('Unable to import: '+e.message)}};input.click();return}if(a==='acceptImport'){if(!pendingImport)return;db=pendingImport;pendingImport=null;db.active=db.profiles.some(z=>z.id===db.active)?db.active:db.profiles[0].id;save();closeModal();render();return toast('All planners and records restored from backup.')}if(a==='setup'){change(()=>p().onboard=0);return}if(a==='onboardCancel'){p().onboard=5;save();closeModal();return render()}if(a==='onboardNext'||a==='onboardBack'){let n=p().onboard||0;if(a==='onboardNext'&&!saveWizardStep(n))return toast('Check the values on this step.');if(a==='onboardNext'&&n===4)return finishWizard();p().onboard=Math.max(0,Math.min(4,n+(a==='onboardNext'?1:-1)));save();return showOnboarding()}if(a==='fresh'){if(!pendingFresh){pendingFresh=true;return modal(`<h2>Start fresh?</h2><p>This clears this profile’s financial data. Export a backup first if you want to keep it.</p><div class="formactions">${btn('Cancel','cancelFresh')}${btn('Yes, start fresh','fresh','danger')}</div>`)}pendingFresh=false;let current=p();let id0=current.id,name=current.name,currency=current.currency,theme=current.theme;change(()=>{Object.assign(current,demo(),{id:id0,name,currency,theme,onboard:5,exampleMode:false});current.accounts=[];current.income=[];current.bills=[];current.debts=[];current.spends=[];current.goals=[];current.envelopes=[];current.budgets=[];current.challenges=[];current.lastSeen=TODAY()});return toast('Fresh planner ready. Add accounts first.')}if(a==='newProfile')return modal(`<h2>Create a planner</h2><div class="field"><label>Planner name</label><input id="newPlannerName" placeholder="Family budget"></div><div class="formactions">${btn('Cancel','close')}${btn('Create planner','saveNewProfile','primary')}</div>`);if(a==='saveNewProfile'){let name=document.getElementById('newPlannerName')?.value?.trim();if(!name)return toast('Enter a planner name.');change(()=>{let x=demo();x.id=uid();x.name=name.trim();x.onboard=5;for(let k of ['accounts','income','bills','spends','goals','debts','envelopes','budgets','challenges'])x[k]=[];db.profiles.push(x);db.active=x.id;page='Today'});closeModal();toast('Planner created.');return}if(a==='renameProfile'){let x=db.profiles.find(x=>x.id===t);return modal(`<h2>Rename planner</h2><div class="field"><label>Name</label><input id="renameValue" value="${esc(x?.name||'')}"></div><div class="formactions">${btn('Cancel','close')}${btn('Save','saveRename:'+t,'primary')}</div>`)}if(a==='saveRename'){let x=db.profiles.find(x=>x.id===t),name=document.getElementById('renameValue')?.value.trim();if(x&&name)change(()=>x.name=name);return closeModal()}if(a==='removeProfile'){if(db.profiles.length===1)return toast('Keep at least one planner.');return confirmDelete('this whole planner',()=>{db.profiles=db.profiles.filter(x=>x.id!==t);if(db.active===t)db.active=db.profiles[0].id})}}
document.addEventListener('click',e=>{if(e.target.id==='modal'){if(p().onboard>=5)closeModal();return}let el=e.target.closest('[data-action],[data-page],[data-amount]');if(!el)return;if(el.dataset.action){e.preventDefault();runAction(el.dataset.action)}else if(el.dataset.page){page=el.dataset.page;document.body.classList.remove('navopen');closeModal();render()}else if(el.dataset.amount){quickAmount=+el.dataset.amount;document.getElementById('quickValue').value=quickAmount;document.querySelectorAll('[data-amount]').forEach(x=>x.classList.toggle('primary',Number(x.dataset.amount)===quickAmount))}});
document.addEventListener('submit',e=>{if(e.target.id!=='entryForm')return;e.preventDefault();let form=e.target,type=form.dataset.type,id=form.dataset.id,item={id:id||uid()};for(let [key,label,kind] of schemas[type]){let inp=form.elements[key];item[key]=kind==='checkbox'?inp.checked:kind==='number'?Number(inp.value||0):inp.value.trim()}if(type==='bill'&&item.cycle==='months'&&(item.interval<2||item.interval>12))return toast('Month interval must be between 2 and 12.');if(type==='account'&&item.balance<0)return toast('Use a nonnegative balance.');if('amount'in item&&item.amount<=0)return toast('Amount must be above zero.');if(type==='goal'&&item.saved>item.target)return toast('Saved cannot exceed goal target when setting up.');change(()=>{let list=p()[collections[type]];if(id){let j=list.findIndex(x=>x.id===id);if(j>=0)list[j]=item}else list.push(item)});closeModal();toast('Saved successfully.')});
document.addEventListener('change',e=>{const el=e.target;if(el.id==='profileSwitch')return change(()=>{db.active=el.value;page='Today';selectedMonth=month(TODAY())});if(el.id==='theme')return change(()=>p().theme=el.value);if(el.id==='accent')return change(()=>p().accent=el.value);if(el.id==='currency')return change(()=>p().currency=el.value);if(el.id==='view')return change(()=>{p().view=el.value;if(el.value==='simple'&&!['Today','Month','Must-pays','Money in','Settings'].includes(page))page='Today'});if(el.id==='debtStrategy')return change(()=>p().strategy=el.value);if(el.id==='extraDebt')return change(()=>p().extraDebt=Math.max(0,moneyVal(el.value)));if(el.id==='reportMonth')return change(()=>selectedMonth=el.value);if(el.dataset.pref)return change(()=>{p().cardPrefs[el.dataset.pref]=el.checked})});document.addEventListener('input',e=>{if(e.target.id==='searchBox')searchResults(e.target.value)});document.addEventListener('keydown',e=>{if(e.key==='Escape'&&p().onboard>=5)closeModal();if(e.key==='Enter'&&e.target.id==='command'){e.preventDefault();runAction('command')}});
function checkAway(){const last=p().lastSeen||TODAY(),days=Math.floor((date(TODAY())-date(last))/MS);p().lastSeen=TODAY();save();if(days>=3&&p().onboard>0){modal(`<div class="eyebrow">Welcome back</div><h2>You're here. That's what matters.</h2><p class="muted">It has been ${days} days. ${billEvents(addDays(TODAY(),-days),TODAY()).filter(x=>!x.paid).length} scheduled bills in that period may need a look. You can catch up gently or start fresh.</p><div class="formactions">${btn('Review bills','awayBills','primary')}${btn('Start fresh','awayFresh')}${btn('Later','close')}</div>`)}}
const original=runAction;runAction=function(act){if(act==='awayBills'){closeModal();page='Must-pays';return render()}if(act==='awayFresh'){closeModal();return original('fresh')}return original(act)};
render();if(p().onboard>0)checkAway();
</script></body></html>
